plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elsdoerfer.android.autostarts'
    compileSdk 36
    defaultConfig {
        applicationId 'com.elsdoerfer.android.autostarts'
        minSdk 21
        targetSdk 36
        versionCode 34
        versionName "2.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
