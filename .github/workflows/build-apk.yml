name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    name: Build R8-optimized release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK with R8
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Upload unsigned APK for device signing
        uses: actions/upload-artifact@v4
        with:
          name: Autostarts-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
